<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KALPA — Feedback Admin</title>
  <style>
    :root {
      --bg: #050711; --panel: #0a0f24; --gold: #d4af37;
      --blue: #4cc9f0; --text: #e8eef8; --muted: #7a8ba8;
      --red: #ef4444; --green: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; min-height: 100vh; }

    /* Login */
    #login-screen {
      display: flex; align-items: center; justify-content: center; height: 100vh;
    }
    .login-box {
      background: var(--panel); border: 1px solid var(--gold);
      border-radius: 16px; padding: 2.5rem; width: 340px; text-align: center;
    }
    .login-box h1 { font-size: 1.6rem; color: var(--gold); margin-bottom: 1.5rem; letter-spacing: 0.2rem; }
    .login-box input {
      width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(76,201,240,0.3); border-radius: 8px; color: #fff; font-size: 1rem;
      margin-bottom: 1rem; outline: none;
    }
    .login-box button {
      width: 100%; padding: 12px; background: var(--gold); border: none;
      border-radius: 8px; color: #040714; font-weight: 700; cursor: pointer; font-size: 1rem;
    }
    .login-error { color: var(--red); font-size: 0.85rem; margin-top: 0.5rem; }

    /* Dashboard */
    #dashboard { display: none; padding: 2rem; max-width: 1200px; margin: 0 auto; }
    .dash-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
    .dash-title { font-size: 1.8rem; color: var(--gold); letter-spacing: 0.3rem; }
    .btn-download {
      background: var(--blue); color: #040714; border: none; padding: 10px 20px;
      border-radius: 20px; font-weight: 700; cursor: pointer;
    }
    .btn-reload { background: transparent; border: 1px solid var(--blue); color: var(--blue);
      padding: 10px 20px; border-radius: 20px; cursor: pointer; margin-right: 0.5rem; }

    /* Stats grid */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card {
      background: var(--panel); border: 1px solid rgba(76,201,240,0.2);
      border-radius: 12px; padding: 1.5rem; text-align: center;
    }
    .stat-value { font-size: 2.2rem; color: var(--gold); font-weight: 700; }
    .stat-label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1rem; margin-top: 0.3rem; }

    /* Charts row */
    .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem; }
    .chart-box { background: var(--panel); border-radius: 12px; padding: 1.2rem; border: 1px solid rgba(255,255,255,0.06); }
    .chart-title { font-size: 0.85rem; color: var(--blue); margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.1rem; }
    .bar-row { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 0.5rem; font-size: 0.82rem; }
    .bar-track { flex: 1; height: 8px; background: rgba(255,255,255,0.08); border-radius: 4px; }
    .bar-fill { height: 100%; border-radius: 4px; background: var(--gold); transition: width 0.5s ease; }
    .bar-label { min-width: 100px; color: var(--muted); }
    .bar-count { min-width: 30px; text-align: right; }

    /* Filters */
    .filter-row { display: flex; gap: 0.8rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .filter-select {
      background: var(--panel); border: 1px solid rgba(76,201,240,0.2);
      color: var(--text); padding: 8px 12px; border-radius: 20px; font-size: 0.85rem;
    }

    /* Comments table */
    .comments-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .comments-table th {
      text-align: left; padding: 10px 14px; color: var(--blue);
      border-bottom: 1px solid rgba(76,201,240,0.2); font-weight: 600; cursor: pointer;
    }
    .comments-table td { padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.04); color: var(--text); vertical-align: top; }
    .comments-table tr:hover td { background: rgba(255,255,255,0.03); }
    .chip-small { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.72rem; margin: 1px;
      background: rgba(76,201,240,0.15); color: var(--blue); }
    .star-display { color: var(--gold); }
    .badge-device { font-size: 0.7rem; padding: 2px 6px; border-radius: 8px; background: rgba(212,175,55,0.15); color: var(--gold); }
    .empty-state { text-align: center; padding: 3rem; color: var(--muted); }
  </style>
</head>
<body>

<!-- Login Gate -->
<div id="login-screen">
  <div class="login-box">
    <h1>ॐ KALPA</h1>
    <p style="color:var(--muted);margin-bottom:1.5rem;font-size:0.85rem">Feedback Admin</p>
    <input type="password" id="admin-pass" placeholder="Admin password" autocomplete="current-password" />
    <button onclick="checkLogin()">Enter</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard">
  <div class="dash-header">
    <div class="dash-title">KALPA · Feedback Dashboard</div>
    <div>
      <button class="btn-reload" onclick="loadData()">↺ Refresh</button>
      <button class="btn-download" onclick="downloadCSV()">↓ Download CSV</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-value" id="stat-total">—</div><div class="stat-label">Total Responses</div></div>
    <div class="stat-card"><div class="stat-value" id="stat-avg-rating">—</div><div class="stat-label">Avg Rating</div></div>
    <div class="stat-card"><div class="stat-value" id="stat-avg-voice">—</div><div class="stat-label">Avg Voice Rating</div></div>
    <div class="stat-card"><div class="stat-value" id="stat-avg-framing">—</div><div class="stat-label">Avg Framing Respect</div></div>
    <div class="stat-card"><div class="stat-value" id="stat-vr-comfort">—</div><div class="stat-label">VR Comfort Issues %</div></div>
    <div class="stat-card"><div class="stat-value" id="stat-avg-fps">—</div><div class="stat-label">Avg FPS</div></div>
  </div>

  <!-- Charts -->
  <div class="charts-row">
    <div class="chart-box">
      <div class="chart-title">Favourite Chapter</div>
      <div id="chart-chapters"></div>
    </div>
    <div class="chart-box">
      <div class="chart-title">Common Issues</div>
      <div id="chart-issues"></div>
    </div>
  </div>

  <!-- Filter row -->
  <div class="filter-row">
    <select class="filter-select" id="filter-device" onchange="applyFilters()">
      <option value="">All Devices</option>
      <option value="desktop">Desktop</option>
      <option value="phone">Phone</option>
      <option value="headset">Headset</option>
    </select>
    <select class="filter-select" id="filter-quality" onchange="applyFilters()">
      <option value="">All Quality Levels</option>
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
    </select>
    <select class="filter-select" id="filter-rating" onchange="applyFilters()">
      <option value="">All Ratings</option>
      <option value="5">★★★★★ Only</option>
      <option value="4">★★★★+ </option>
      <option value="1">★ and below</option>
    </select>
  </div>

  <!-- Comments table -->
  <div style="background:var(--panel);border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,0.06)">
    <table class="comments-table">
      <thead>
        <tr>
          <th onclick="sortBy('timestamp')">Date ↕</th>
          <th onclick="sortBy('rating')">Rating ↕</th>
          <th>Device</th>
          <th>Chapter</th>
          <th>Issues</th>
          <th>Comment</th>
          <th>FPS</th>
        </tr>
      </thead>
      <tbody id="comments-tbody">
        <tr><td colspan="7" class="empty-state">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  let allData = [];
  let sortKey = 'timestamp';
  let sortDir = -1;

  // Password check (env-based in a real deployment, use server-side auth)
  function checkLogin() {
    const pass = document.getElementById('admin-pass').value;
    const envPass = 'kalpa2024'; // Normally set via .env ADMIN_PASSWORD
    if (pass === envPass) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadData();
    } else {
      document.getElementById('login-error').textContent = 'Incorrect password.';
    }
  }

  document.getElementById('admin-pass').addEventListener('keydown', e => {
    if (e.key === 'Enter') checkLogin();
  });

  async function loadData() {
    const url = (window.__KALPA_ADMIN_URL || '').trim();
    if (!url) {
      allData = getSampleData();
    } else {
      try {
        const resp = await fetch(url);
        allData = await resp.json();
      } catch {
        allData = getSampleData();
      }
    }
    renderAll(allData);
  }

  function renderAll(data) {
    renderStats(data);
    renderChartChapters(data);
    renderChartIssues(data);
    renderTable(data);
  }

  function renderStats(data) {
    const avg = arr => arr.length ? (arr.reduce((a, b) => a + b, 0) / arr.length).toFixed(1) : '—';
    document.getElementById('stat-total').textContent = data.length;
    document.getElementById('stat-avg-rating').textContent = avg(data.map(d => d.rating || 0)) + ' ★';
    document.getElementById('stat-avg-voice').textContent = avg(data.map(d => d.voiceRating || 0)) + ' ★';
    document.getElementById('stat-avg-framing').textContent = avg(data.map(d => d.framingRespect || 0)) + ' ★';
    const discomfortPct = data.length ? Math.round(data.filter(d => d.vrComfort && d.vrComfort !== 'none').length / data.length * 100) : 0;
    document.getElementById('stat-vr-comfort').textContent = discomfortPct + '%';
    document.getElementById('stat-avg-fps').textContent = avg(data.map(d => d.meta?.avgFps || 0));
  }

  function renderChartChapters(data) {
    const counts = {};
    data.forEach(d => { if (d.favouriteChapter !== '') counts[d.favouriteChapter] = (counts[d.favouriteChapter] || 0) + 1; });
    const max = Math.max(...Object.values(counts), 1);
    const names = ['Void','Cosmic Ocean','Lotus','Nebula','Accretion','Theia','Magma','Oceans','Life','Avatars','Yugas','Pralaya'];
    document.getElementById('chart-chapters').innerHTML = Object.entries(counts)
      .sort((a,b) => b[1]-a[1]).slice(0,8)
      .map(([k,v]) => `
        <div class="bar-row">
          <span class="bar-label">${names[k] || 'Ch '+k}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${(v/max)*100}%"></div></div>
          <span class="bar-count">${v}</span>
        </div>`).join('') || '<div style="color:var(--muted);font-size:0.85rem">No data yet</div>';
  }

  function renderChartIssues(data) {
    const counts = {};
    data.forEach(d => (d.issues || []).forEach(i => { counts[i] = (counts[i] || 0) + 1; }));
    const max = Math.max(...Object.values(counts), 1);
    document.getElementById('chart-issues').innerHTML = Object.entries(counts)
      .sort((a,b) => b[1]-a[1]).slice(0,8)
      .map(([k,v]) => `
        <div class="bar-row">
          <span class="bar-label">${k}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${(v/max)*100}%;background:#ef4444"></div></div>
          <span class="bar-count">${v}</span>
        </div>`).join('') || '<div style="color:var(--muted);font-size:0.85rem">No issues reported</div>';
  }

  function applyFilters() {
    const device = document.getElementById('filter-device').value;
    const quality = document.getElementById('filter-quality').value;
    const rating = document.getElementById('filter-rating').value;
    let filtered = allData;
    if (device) filtered = filtered.filter(d => d.meta?.deviceType === device);
    if (quality) filtered = filtered.filter(d => d.meta?.qualityLevel === quality);
    if (rating) filtered = filtered.filter(d => d.rating >= parseInt(rating));
    renderTable(filtered);
  }

  function sortBy(key) {
    if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = -1; }
    applyFilters();
  }

  function renderTable(data) {
    const stars = n => '★'.repeat(n || 0) + '☆'.repeat(5 - (n || 0));
    const sorted = [...data].sort((a, b) => {
      const av = sortKey === 'timestamp' ? new Date(a.meta?.timestamp) : (a[sortKey] || 0);
      const bv = sortKey === 'timestamp' ? new Date(b.meta?.timestamp) : (b[sortKey] || 0);
      return av > bv ? sortDir : -sortDir;
    });

    const names = ['Void','Cosmic Ocean','Lotus','Nebula','Accretion','Theia','Magma','Oceans','Life','Avatars','Yugas','Pralaya'];
    document.getElementById('comments-tbody').innerHTML = sorted.length ? sorted.map(d => `
      <tr>
        <td style="white-space:nowrap;color:var(--muted);font-size:0.78rem">${d.meta?.timestamp?.substring(0,16).replace('T',' ') || '?'}</td>
        <td><span class="star-display">${stars(d.rating)}</span></td>
        <td><span class="badge-device">${d.meta?.deviceType || '?'}</span></td>
        <td>${names[d.favouriteChapter] || (d.favouriteChapter || '—')}</td>
        <td>${(d.issues || []).map(i => `<span class="chip-small">${i}</span>`).join('')}</td>
        <td style="max-width:240px;word-break:break-word">${d.issueText || d.framingComment || '—'}</td>
        <td style="color:var(--muted)">${d.meta?.avgFps || '?'}</td>
      </tr>`).join('')
    : '<tr><td colspan="7" class="empty-state">No submissions yet.</td></tr>';
  }

  function downloadCSV() {
    const headers = ['Date','Rating','Device','Quality','FPS','ChapterReached','FavouriteChapter','Issues','Comment','VRComfort','VoiceRating','FramingRespect','FramingComment','Email','ContactOk'];
    const rows = allData.map(d => [
      d.meta?.timestamp, d.rating, d.meta?.deviceType, d.meta?.qualityLevel,
      d.meta?.avgFps, d.meta?.chapterReached, d.favouriteChapter,
      (d.issues||[]).join('; '), d.issueText, d.vrComfort, d.voiceRating,
      d.framingRespect, d.framingComment, d.email, d.contactOk
    ].map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(','));

    const csv = [headers.join(','), ...rows].join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `kalpa_feedback_${Date.now()}.csv`;
    a.click(); URL.revokeObjectURL(url);
  }

  function getSampleData() {
    return [
      { rating: 5, voiceRating: 4, framingRespect: 5, favouriteChapter: '7', vrComfort: 'none',
        issues: [], issueText: 'Deeply moving experience.', meta: { timestamp: new Date().toISOString(), deviceType: 'desktop', qualityLevel: 'high', avgFps: 82, chapterReached: 11 } },
      { rating: 4, voiceRating: 3, framingRespect: 4, favouriteChapter: '5', vrComfort: 'mild',
        issues: ['Too dark'], issueText: 'Magma scene was a bit dark.', meta: { timestamp: new Date(Date.now()-86400000).toISOString(), deviceType: 'phone', qualityLevel: 'medium', avgFps: 44, chapterReached: 8 } }
    ];
  }
</script>
</body>
</html>
